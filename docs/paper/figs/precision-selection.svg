   <g id="text_1">
    <text style="font: 700 16px 'DejaVu Sans'; text-anchor: middle" x="369.9" y="21.06" transform="rotate(-0 369.9 21.06)">Adaptive precision: smallest serialized candidate that passes all checks</text>
   </g>
   <g id="text_2">
    <text style="font: 11px 'DejaVu Sans'" transform="translate(268.996484 66.578773)">One complex64 block + source flags</text>
    <text style="font: 11px 'DejaVu Sans'" transform="translate(290.831484 81.403852)">and configured error ceilings</text>
   </g>
   <g id="text_3">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(44.253281 154.486031)">Always construct exact candidate</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(58.211094 167.963375)">original float32 components</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(67.540781 181.440719)">compress only if smaller</text>
   </g>
   <g id="text_4">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(331.921563 154.486031)">Try b ∈ {4, 8, 12, 16} and scale quantiles q ∈ {1, 0.995}</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(375.095 167.963375)">step = stored float32(cutoff / (2ᵇ⁻¹ − 1))</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(367.318438 181.440719)">adjust upward if needed to cover the cutoff</text>
   </g>
   <g id="text_5">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(341.911406 248.734031)">Quantize real and imaginary with the same local step</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(314.366875 262.211375)">Preserve flagged / nonfinite / signed-zero / outlier values exactly</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(324.987188 275.688719)">Pack codes; append positions + exact exceptions; compress</text>
   </g>
   <g id="text_6">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(334.820781 344.731103)">Decode using stored step and actual decoder arithmetic</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(325.929375 358.208447)">Measure complex errors on source-unflagged finite samples</text>
   </g>
   <g id="text_7">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(427.452891 431.532422)">Finite reconstruction?</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(362.312578 441.610453)">MSE + max error + bias + per-baseline MSE pass?</text>
   </g>
   <g id="text_8">
    <g id="patch_19">
     <path d="M 673.875 427.8708
L 688.095 427.8708
L 688.095 417.180488
L 673.875 417.180488
z
" style="fill: #ffffff"/>
    </g>
    <text style="font: 9px 'DejaVu Sans'; text-anchor: middle" x="680.985" y="425.009081" transform="rotate(-0 680.985 425.009081)">No</text>
   </g>
   <g id="text_9">
    <text style="fill: #b84d52; font: 10px 'DejaVu Sans'" transform="translate(680.829219 458.926187)">Reject</text>
    <text style="fill: #b84d52; font: 10px 'DejaVu Sans'" transform="translate(671.509688 470.124)">candidate</text>
   </g>
   <g id="text_10">
    <g id="patch_20">
     <path d="M 289.104609 470.8368
L 305.615391 470.8368
L 305.615391 460.146488
L 289.104609 460.146488
z
" style="fill: #ffffff"/>
    </g>
    <text style="font: 9px 'DejaVu Sans'; text-anchor: middle" x="297.36" y="467.975081" transform="rotate(-0 297.36 467.975081)">Yes</text>
   </g>
   <g id="text_11">
    <text style="fill: #247c77; font: 10px 'DejaVu Sans'" transform="translate(105.55875 228.850187)">Exact is always eligible</text>
    <text style="fill: #247c77; font: 10px 'DejaVu Sans'" transform="translate(97.442344 240.048)">(zero reconstruction error)</text>
   </g>
   <g id="text_12">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(97.149375 487.677023)">Choose minimum actual serialized bytes</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(107.371406 499.806633)">16-byte header + compressed body</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(90.395156 511.936242)">(codes + exceptions, or exact components)</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(84.736406 524.065852)">Fixed index cost is identical across candidates</text>
   </g>
   <g id="text_13">
    <text style="font: 10px 'DejaVu Sans'" transform="translate(425.240313 502.180703)">Store winner; verify whole-product bounds</text>
    <text style="font: 10px 'DejaVu Sans'" transform="translate(445.70125 515.658047)">then finalize archive + checksums</text>
   </g>
   <g id="text_14">
    <text style="fill: #65727e; font: 10px 'DejaVu Sans'" transform="translate(92.167344 305.55425)">No amplitude-to-bits lookup.</text>
    <text style="fill: #65727e; font: 10px 'DejaVu Sans'" transform="translate(118.676719 321.311125)">No silent clipping.</text>
    <text style="fill: #65727e; font: 10px 'DejaVu Sans'" transform="translate(78.400156 337.068)">No inferred thermal-noise budget.</text>
   </g>
   <g id="text_15">
    <text style="font: 9px 'DejaVu Sans'; text-anchor: middle" x="369.9" y="559.9368" transform="rotate(-0 369.9 559.9368)">Logical decision diagram: implementation skips error evaluation for candidates already larger than the best valid encoding.</text>
   </g>
  </g>
 </g>
