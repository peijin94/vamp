[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varquanMS"
version = "0.2.0.dev0"
description = "Inspection and adaptive visibility archive experiments for CASA Measurement Sets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "python-casacore>=3.5", "h5py>=3.9"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
visarchive = "varquanms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
